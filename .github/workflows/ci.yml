name: CI
on:
  push:
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/EnterpriseRag.Tests/EnterpriseRag.Tests.csproj
      - run: dotnet build tests/EnterpriseRag.Tests/EnterpriseRag.Tests.csproj --no-restore --configuration Release
      - run: dotnet test tests/EnterpriseRag.Tests/EnterpriseRag.Tests.csproj --no-build --configuration Release
